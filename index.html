<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>새로이의 식물 관찰 일기</title>

    <!-- PWA 및 아이패드 홈 화면 아이콘 설정 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="새로이 식물일기">
    <link rel="apple-touch-icon" href="https://img.icons8.com/emoji/192/potted-plant-emoji.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Jua', sans-serif; background-color: #f0fdf4; -webkit-tap-highlight-color: transparent; font-size: 1.1rem; }
        .tab-active { background-color: #22c55e; color: white; transform: scale(1.05); }
        .stage-selected { border-color: #22c55e !important; background-color: #f0fdf4 !important; font-weight: bold; color: #15803d !important; }
        .action-selected { background-color: #22c55e !important; color: white !important; border-color: #22c55e !important; }
        .mic-recording { animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
    </style>
</head>
<body class="p-4 max-w-2xl mx-auto text-gray-800 pb-20">

    <header class="text-center my-6">
        <h1 class="text-4xl text-green-600 drop-shadow-sm">🌿 새로이의 초록 정원 🍅</h1>
        <p class="text-gray-600 mt-1 text-base">내가 직접 키우고 관찰하는 세상에 하나뿐인 일기장</p>
    </header>

    <!-- 식물 탭 (백업/복원은 ⚙️ 관리 모드에서만 보임) -->
    <div class="bg-white p-4 rounded-2xl shadow-md mb-6">
        <div class="flex items-center justify-between mb-3">
            <h2 class="text-xl text-green-700 font-bold">🌱 내 식물 목록</h2>
            <div class="flex gap-1.5 flex-wrap justify-end">
                <button type="button" onclick="toggleManageMode()" id="manageBtn" class="bg-gray-100 text-gray-700 px-3 py-1.5 rounded-full text-sm font-bold border border-gray-300">⚙️ 관리</button>
                <button type="button" onclick="exportData()" id="exportBtn" class="hidden bg-blue-50 text-blue-600 px-3 py-1.5 rounded-full text-sm font-bold border border-blue-200">📤 백업</button>
                <button type="button" onclick="document.getElementById('importFileInput').click()" id="importBtn" class="hidden bg-blue-50 text-blue-600 px-3 py-1.5 rounded-full text-sm font-bold border border-blue-200">📥 복원</button>
                <input type="file" id="importFileInput" accept=".json" class="hidden" onchange="importData(event)">
                <button type="button" onclick="openNewPlantModal()" class="bg-green-500 text-white px-3.5 py-1.5 rounded-full text-sm font-bold shadow hover:bg-green-600 transition">+ 새 식물</button>
            </div>
        </div>
        <div id="plantTabs" class="flex gap-2 overflow-x-auto pb-2 items-center"></div>
    </div>

    <div id="dashboard" class="space-y-6">
        <div class="bg-white p-5 rounded-2xl shadow-md">
            <h3 class="text-lg text-green-700 font-bold mb-3 flex items-center gap-2">✨ 처음 모습과 오늘의 모습</h3>
            <div class="grid grid-cols-2 gap-4 text-center">
                <div class="border-2 border-dashed border-green-200 p-2 rounded-xl bg-green-50">
                    <p class="text-sm text-gray-600 mb-1">처음 심었던 날 🌱</p>
                    <div id="firstPhotoContainer" class="h-40 bg-gray-100 rounded-lg flex items-center justify-center overflow-hidden text-gray-400 cursor-pointer" onclick="showImageZoomFromContainer(this)">사진 없음</div>
                </div>
                <div class="border-2 border-dashed border-green-200 p-2 rounded-xl bg-green-50">
                    <p class="text-sm text-gray-600 mb-1">오늘 찍은 모습 📷</p>
                    <div id="latestPhotoContainer" class="h-40 bg-gray-100 rounded-lg flex items-center justify-center overflow-hidden text-gray-400 cursor-pointer" onclick="showImageZoomFromContainer(this)">사진 없음</div>
                </div>
            </div>
        </div>

        <button type="button" onclick="openRecordModal()" class="w-full bg-gradient-to-r from-green-500 to-emerald-600 text-white text-2xl py-4 rounded-2xl shadow-lg hover:from-green-600 hover:to-emerald-700 transition transform active:scale-95 flex items-center justify-center gap-3 font-bold">
            📷 오늘 관찰 기록 쓰기!
        </button>

        <div class="bg-white p-5 rounded-2xl shadow-md">
            <h3 class="text-lg text-green-700 font-bold mb-4">📖 성장 타임라인 앨범</h3>
            <div id="timelineList" class="space-y-4"></div>
        </div>
    </div>

    <!-- 관찰 기록 작성 모달 -->
    <div id="recordModal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white w-full max-w-lg rounded-3xl p-6 max-h-[90vh] overflow-y-auto shadow-2xl space-y-5">
            <div class="flex items-center justify-between border-b pb-3">
                <button type="button" onclick="closeRecordModal()" class="text-green-700 font-bold text-base bg-green-50 px-3 py-1.5 rounded-xl hover:bg-green-100">〈 뒤로</button>
                <h2 id="modalTitle" class="text-xl text-green-700 font-bold text-center flex-1">📝 오늘의 관찰 카드 쓰기</h2>
                <div class="w-16"></div>
            </div>

            <div>
                <label class="block text-base font-bold text-green-700 mb-1">0. 어떤 식물인가요? 🌱</label>
                <select id="recordPlantSelect" class="w-full p-3.5 border-2 border-green-300 rounded-xl bg-green-50 text-lg font-bold text-green-900"></select>
            </div>

            <div>
                <label class="block text-base font-bold text-gray-700 mb-1">1. 오늘의 식물 사진 📷</label>
                <input type="file" id="photoInput" accept="image/*" class="hidden" onchange="previewImage(event)">
                <input type="file" id="cameraInput" accept="image/*" capture="environment" class="hidden" onchange="previewImage(event)">
                <div id="photoPreviewBox" class="border-2 border-dashed border-green-400 h-44 rounded-2xl flex flex-col items-center justify-center bg-green-50 cursor-pointer hover:bg-green-100 transition text-green-600 mb-2 overflow-hidden" onclick="document.getElementById('photoInput').click()"></div>
                <div class="grid grid-cols-2 gap-2">
                    <button type="button" onclick="document.getElementById('photoInput').click()" class="bg-green-100 text-green-800 py-3 rounded-xl text-base font-bold flex items-center justify-center gap-1.5 hover:bg-green-200">📁 사진 보관함에서 고르기</button>
                    <button type="button" onclick="document.getElementById('cameraInput').click()" class="bg-emerald-500 text-white py-3 rounded-xl text-base font-bold flex items-center justify-center gap-1.5 hover:bg-emerald-600 shadow">📸 카메라로 바로 찍기</button>
                </div>
            </div>

            <div>
                <label class="block text-base font-bold text-gray-700 mb-1">2. 지금 식물은 어떤 모습인가요? (중복 가능)</label>
                <div class="grid grid-cols-2 gap-2" id="stageSelector"></div>
            </div>

            <div class="space-y-3 bg-green-50/60 p-4 rounded-2xl border border-green-100">
                <label class="block text-base font-bold text-gray-700">3. 식물을 자세히 살펴봐요 🔍</label>
                <div class="grid grid-cols-2 gap-3">
                    <div><span class="text-sm font-bold text-gray-600">🍃 잎 색깔</span><select id="leafColor" class="w-full p-3 border rounded-xl bg-white text-base font-bold mt-1"></select></div>
                    <div><span class="text-sm font-bold text-gray-600">📏 잎의 크기·양</span><select id="leafSize" class="w-full p-3 border rounded-xl bg-white text-base font-bold mt-1"></select></div>
                    <div><span class="text-sm font-bold text-gray-600">💧 흙 상태</span><select id="soilState" class="w-full p-3 border rounded-xl bg-white text-base font-bold mt-1"></select></div>
                    <div><span class="text-sm font-bold text-gray-600">🐛 비밀 관찰</span><select id="bugState" class="w-full p-3 border rounded-xl bg-white text-base font-bold mt-1"></select></div>
                </div>
            </div>

            <div>
                <label class="block text-base font-bold text-gray-700 mb-1">4. 새로이가 발견한 것 🎤</label>
                <div class="flex gap-2 items-center">
                    <div class="relative flex-1 flex items-center">
                        <input type="text" id="voiceNoteInput" placeholder="마이크를 누르고 말해요!" class="w-full p-3.5 pr-10 border-2 border-gray-200 rounded-xl text-base font-bold" oninput="checkInputText()">
                        <button type="button" id="clearBtn" onclick="clearVoiceInput()" class="absolute right-3 text-gray-400 hover:text-gray-600 font-bold text-lg hidden">✕</button>
                    </div>
                    <button type="button" id="speechBtn" onclick="toggleSpeechRecognition()" class="bg-blue-500 text-white w-14 h-14 rounded-xl text-2xl flex items-center justify-center hover:bg-blue-600 transition flex-shrink-0 shadow" title="음성 입력">🎤</button>
                </div>
            </div>

            <div>
                <label class="block text-base font-bold text-gray-700 mb-1">5. 오늘 내가 해준 일 👐</label>
                <div class="flex flex-wrap gap-2" id="actionSelector"></div>
            </div>

            <div class="flex gap-3 pt-2">
                <button type="button" onclick="closeRecordModal()" class="flex-1 bg-gray-200 text-gray-700 py-3.5 rounded-xl font-bold text-lg hover:bg-gray-300">취소</button>
                <button type="button" id="saveBtn" onclick="saveRecord()" class="flex-1 bg-green-500 text-white py-3.5 rounded-xl font-bold text-lg hover:bg-green-600 shadow-md">저장하기 🎉</button>
            </div>
        </div>
    </div>

    <!-- 새 식물 추가 모달 -->
    <div id="newPlantModal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white w-full max-w-md rounded-3xl p-6 shadow-2xl">
            <h2 class="text-xl text-green-700 font-bold mb-3 text-center">🌱 새로운 식물 등록</h2>
            <input type="text" id="newPlantName" placeholder="식물 이름 (예: 바질 🌿)" class="w-full p-3.5 border-2 border-gray-200 rounded-xl mb-4 text-base font-bold">
            <div class="flex gap-3">
                <button type="button" onclick="closeNewPlantModal()" class="flex-1 bg-gray-200 text-gray-700 py-3 rounded-xl font-bold text-base">취소</button>
                <button type="button" onclick="addNewPlant()" class="flex-1 bg-green-500 text-white py-3 rounded-xl font-bold text-base">등록하기</button>
            </div>
        </div>
    </div>

    <!-- 이미지 확대 보기 모달 -->
    <div id="imageZoomModal" class="fixed inset-0 bg-black/80 hidden flex items-center justify-center p-4 z-50 cursor-pointer" onclick="closeImageZoom()">
        <div class="relative max-w-3xl w-full max-h-[90vh] flex items-center justify-center">
            <img id="zoomedImage" src="" class="max-w-full max-h-[85vh] object-contain rounded-2xl shadow-2xl">
            <button type="button" onclick="closeImageZoom()" class="absolute top-2 right-2 bg-black/60 text-white w-10 h-10 rounded-full font-bold text-xl flex items-center justify-center">✕</button>
        </div>
    </div>

    <script>
        const DB_NAME = 'PlantJournalDB', STORE_NAME = 'records', META_STORE = 'meta';
        const DEFAULT_PLANT = "방울토마토 🍅";
        const STAGES = ['💤 잠자고 있어요', '🌱 새싹이 쏙!', '🌿 잎이 쑥쑥!', '📏 키가 쑥 컸어요', '🌸 예쁜 꽃이 펴요', '🍅 열매가 열렸어요', '🤒 아파요', '🍂 잎이 시들어요'];
        const ACTIONS = ['💧 물 주기', '☀️ 햇빛 쬐어주기', '🧹 잎 닦아주기', '💊 영양제 주기', '❤️ "사랑해" 말하기'];
        const OPTIONS = {
            leafColor: ['🟢 싱싱한 초록', '🟡 연두/노랑', '🎨 얼룩달룩', '🟤 시든 갈색'],
            leafSize: ['🌱 잎이 늘어남', '✋ 손바닥만함', '🙂 어제와 비슷'],
            soilState: ['💧 촉촉해요', '🙂 보통이에요', '☀️ 바짝 말랐어요'],
            bugState: ['✨ 깨끗해요', '🐛 벌레 발견!', '💧 이슬이 맺힘']
        };

        let db = null;
        let plantCache = [DEFAULT_PLANT];
        let currentPlant = DEFAULT_PLANT;
        let isManageMode = false;
        let capturedImage = null;
        let editingRecordId = null;
        let editingDate = null;
        let recognition = null;
        let isRecording = false;
        let isSaving = false;
        let audioCtx = null;

        const $ = (id) => document.getElementById(id);
        const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

        function playSound(freq, duration) {
            try {
                audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.frequency.value = freq;
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch (e) {}
        }

        function triggerHaptic() {
            if (navigator.vibrate) navigator.vibrate(50);
        }

        // ---------- IndexedDB ----------
        function initDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, 2);
                request.onerror = (e) => reject(e.target.error);
                request.onsuccess = (e) => {
                    db = e.target.result;
                    db.onversionchange = () => db.close();
                    resolve(db);
                };
                request.onupgradeneeded = (e) => {
                    const d = e.target.result;
                    if (!d.objectStoreNames.contains(STORE_NAME)) d.createObjectStore(STORE_NAME, { keyPath: 'id', autoIncrement: true });
                    if (!d.objectStoreNames.contains(META_STORE)) d.createObjectStore(META_STORE);
                };
            });
        }

        function req(r) {
            return new Promise((resolve, reject) => {
                r.onsuccess = () => resolve(r.result);
                r.onerror = (e) => reject(e.target.error);
            });
        }

        function done(t) {
            return new Promise((resolve, reject) => {
                t.oncomplete = () => resolve();
                t.onerror = (e) => reject(e.target.error);
                t.onabort = () => reject(t.error || new Error('transaction aborted'));
            });
        }

        const getAllRecords = () => req(db.transaction(STORE_NAME).objectStore(STORE_NAME).getAll());
        const getRecordById = (id) => req(db.transaction(STORE_NAME).objectStore(STORE_NAME).get(id));

        async function saveRecordToDB(record) {
            const t = db.transaction(STORE_NAME, 'readwrite');
            t.objectStore(STORE_NAME).put(record);
            await done(t);
        }

        async function deleteRecordById(id) {
            if (!confirm('이 관찰 기록을 삭제하시겠습니까?')) return;
            try {
                const t = db.transaction(STORE_NAME, 'readwrite');
                t.objectStore(STORE_NAME).delete(id);
                await done(t);
                await renderDashboard();
            } catch (e) {
                alert('삭제하지 못했어요. 다시 해 주세요.');
            }
        }

        async function deleteRecordsByPlant(plantName) {
            const records = await getAllRecords();
            const t = db.transaction(STORE_NAME, 'readwrite');
            const store = t.objectStore(STORE_NAME);
            records.forEach(rec => { if (rec.plantName === plantName) store.delete(rec.id); });
            await done(t);
        }

        async function renamePlantInDB(oldName, newName) {
            const records = await getAllRecords();
            const t = db.transaction(STORE_NAME, 'readwrite');
            const store = t.objectStore(STORE_NAME);
            records.forEach(rec => {
                if (rec.plantName === oldName) { rec.plantName = newName; store.put(rec); }
            });
            await done(t);
        }

        // ---------- 식물 목록 (IndexedDB 저장 + localStorage 보조 사본) ----------
        const getPlantList = () => plantCache;

        async function savePlantList(list) {
            plantCache = list;
            try { localStorage.setItem('plant_list', JSON.stringify(list)); } catch (e) {}
            try {
                const t = db.transaction(META_STORE, 'readwrite');
                t.objectStore(META_STORE).put(list, 'plant_list');
                await done(t);
            } catch (e) { console.error('식물 목록 저장 실패', e); }
        }

        // 기록에는 있는데 목록에 없는 식물(목록만 유실된 경우)을 자동 복구
        async function syncPlants() {
            const names = [...new Set((await getAllRecords()).map(r => r.plantName).filter(Boolean))];
            const missing = names.filter(n => !plantCache.includes(n));
            if (missing.length) await savePlantList([...plantCache, ...missing]);
        }

        async function loadPlantList() {
            let list = null;
            try { list = await req(db.transaction(META_STORE).objectStore(META_STORE).get('plant_list')); } catch (e) {}
            if (!Array.isArray(list) || !list.length) {
                try { list = JSON.parse(localStorage.getItem('plant_list')); } catch (e) {}
            }
            plantCache = (Array.isArray(list) && list.length) ? list : [DEFAULT_PLANT];
            await savePlantList(plantCache);
            await syncPlants();
        }

        // ---------- 초기화 ----------
        function buildForm() {
            STAGES.forEach(t => {
                const b = document.createElement('button');
                b.type = 'button';
                b.className = 'stage-btn p-3 border-2 border-gray-200 rounded-xl text-center text-base';
                b.textContent = t;
                b.onclick = () => b.classList.toggle('stage-selected');
                $('stageSelector').appendChild(b);
            });
            ACTIONS.forEach(t => {
                const b = document.createElement('button');
                b.type = 'button';
                b.className = 'action-btn px-3.5 py-2.5 border-2 border-gray-200 rounded-xl text-base';
                b.textContent = t;
                b.onclick = () => b.classList.toggle('action-selected');
                $('actionSelector').appendChild(b);
            });
            Object.entries(OPTIONS).forEach(([id, list]) => list.forEach(t => $(id).add(new Option(t))));
        }

        async function initApp() {
            buildForm();
            try {
                if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
                await initDB();
                await loadPlantList();
                if (!plantCache.includes(currentPlant)) currentPlant = plantCache[0];
                await renderDashboard();
            } catch (err) {
                console.error('앱 초기화 오류:', err);
                alert('저장소를 열 수 없어요. 사파리 비공개 모드이거나 저장 공간이 부족할 수 있어요.');
            }
        }

        // ---------- 식물 탭 / 관리 ----------
        function toggleManageMode() {
            isManageMode = !isManageMode;
            $('manageBtn').innerText = isManageMode ? "✅ 완료" : "⚙️ 관리";
            ['exportBtn', 'importBtn'].forEach(id => $(id).classList.toggle('hidden', !isManageMode));
            renderTabs();
        }

        function renderTabs() {
            const container = $('plantTabs');
            container.innerHTML = '';
            getPlantList().forEach(plant => {
                const wrapper = document.createElement('div');
                wrapper.className = "flex items-center gap-1 bg-white p-1 rounded-xl border border-gray-200 shadow-sm";

                const btn = document.createElement('button');
                btn.type = "button";
                btn.className = `px-3.5 py-2 rounded-lg text-base font-bold transition ${plant === currentPlant ? 'tab-active' : 'text-gray-700'}`;
                btn.innerText = plant;
                btn.onclick = async () => { currentPlant = plant; await renderDashboard(); };
                wrapper.appendChild(btn);

                if (isManageMode) {
                    const editBtn = document.createElement('button');
                    editBtn.type = "button";
                    editBtn.innerText = "✏️";
                    editBtn.className = "text-base p-2.5 hover:bg-gray-100 rounded";
                    editBtn.onclick = (e) => { e.stopPropagation(); editPlantName(plant); };

                    const delBtn = document.createElement('button');
                    delBtn.type = "button";
                    delBtn.innerText = "🗑️";
                    delBtn.className = "text-base p-2.5 hover:bg-gray-100 rounded";
                    delBtn.onclick = (e) => { e.stopPropagation(); deletePlant(plant); };

                    wrapper.appendChild(editBtn);
                    wrapper.appendChild(delBtn);
                }
                container.appendChild(wrapper);
            });
        }

        async function editPlantName(oldName) {
            const input = prompt('식물 이름을 수정해 주세요:', oldName);
            if (input === null) return;
            const newName = input.trim();
            if (!newName || newName === oldName) return;
            const plants = [...getPlantList()];
            if (plants.includes(newName)) return alert('이미 있는 이름이에요!');
            const idx = plants.indexOf(oldName);
            if (idx === -1) return;
            try {
                await renamePlantInDB(oldName, newName);
                plants[idx] = newName;
                await savePlantList(plants);
                if (currentPlant === oldName) currentPlant = newName;
                await renderDashboard();
            } catch (e) {
                alert('이름을 바꾸지 못했어요.');
            }
        }

        async function deletePlant(plantName) {
            const plants = getPlantList();
            if (plants.length <= 1) return alert('최소 하나의 식물은 남아있어야 해요!');
            if (!confirm(`'${plantName}' 식물을 삭제할까요? 기록도 함께 사라져요.`)) return;
            try {
                await deleteRecordsByPlant(plantName);
                await savePlantList(plants.filter(p => p !== plantName));
                currentPlant = getPlantList()[0];
                await renderDashboard();
            } catch (e) {
                alert('삭제하지 못했어요. 다시 해 주세요.');
            }
        }

        // ---------- 화면 그리기 ----------
        async function renderDashboard() {
            renderTabs();
            const records = (await getAllRecords()).filter(r => r.plantName === currentPlant).sort((a, b) => a.id - b.id);

            const setBox = (box, rec) => {
                box.innerHTML = rec ? `<img src="${rec.photo}" class="w-full h-full object-cover rounded-lg">` : "사진 없음";
            };
            setBox($('firstPhotoContainer'), records[0]);
            setBox($('latestPhotoContainer'), records[records.length - 1]);

            const timeline = $('timelineList');
            if (records.length === 0) {
                timeline.innerHTML = `<p class="text-center text-gray-400 py-8 text-base">아직 관찰 기록이 없어요.<br>첫 관찰 기록을 남겨보세요! 📷</p>`;
                return;
            }

            timeline.innerHTML = [...records].reverse().map(rec => `
                <div class="flex gap-4 p-4 border-2 border-green-100 rounded-2xl bg-green-50/50 items-center">
                    <img src="${rec.photo}" class="w-24 h-24 object-cover rounded-xl shadow cursor-pointer flex-shrink-0" onclick="showImageZoom(this.src)">
                    <div class="flex-1 min-w-0">
                        <div class="flex justify-between items-center mb-1">
                            <span class="font-bold text-green-800 text-base">${esc(rec.date)}</span>
                            <span class="bg-green-200 text-green-900 text-xs px-2.5 py-1 rounded-full font-bold">${esc((rec.stages || []).join(', '))}</span>
                        </div>
                        <p class="text-base text-gray-800 font-bold mb-1 truncate">💬 "${esc(rec.note || '오늘도 무럭무럭 자라라!')}"</p>
                        <p class="text-sm text-gray-600">🔍 ${esc(rec.leafColor)} | ${esc(rec.soil)} | ${esc(rec.bugState)}</p>
                        <p class="text-sm text-green-700 mt-0.5">👐 ${esc((rec.actions || []).join(', '))}</p>
                        <div class="flex gap-2 mt-2">
                            <button type="button" onclick="openRecordModal(${Number(rec.id)})" class="text-sm bg-white border border-green-300 text-green-700 px-3.5 py-2.5 rounded-lg font-bold hover:bg-green-50">✏️ 수정</button>
                            <button type="button" onclick="deleteRecordById(${Number(rec.id)})" class="text-sm bg-white border border-red-200 text-red-500 px-3.5 py-2.5 rounded-lg font-bold hover:bg-red-50">🗑️ 삭제</button>
                        </div>
                    </div>
                </div>`).join('');
        }

        // ---------- 기록 작성 / 수정 ----------
        async function openRecordModal(recordId = null) {
            editingRecordId = recordId;
            editingDate = null;
            capturedImage = null;
            $('voiceNoteInput').value = '';
            checkInputText();
            $('photoInput').value = '';
            $('cameraInput').value = '';
            document.querySelectorAll('.stage-btn').forEach(b => b.classList.remove('stage-selected'));
            document.querySelectorAll('.action-btn').forEach(b => b.classList.remove('action-selected'));
            Object.keys(OPTIONS).forEach(id => { $(id).selectedIndex = 0; });

            const select = $('recordPlantSelect');
            select.innerHTML = '';
            getPlantList().forEach(plant => {
                const opt = document.createElement('option');
                opt.value = plant;
                opt.innerText = plant;
                if (plant === currentPlant) opt.selected = true;
                select.appendChild(opt);
            });

            let rec = null;
            if (editingRecordId) {
                try { rec = await getRecordById(editingRecordId); } catch (e) {}
                if (!rec) { editingRecordId = null; alert('기록을 불러오지 못했어요.'); }
            }

            if (rec) {
                $('modalTitle').innerText = "📝 관찰 카드 수정하기";
                editingDate = rec.date;
                select.value = rec.plantName;
                capturedImage = rec.photo;
                $('photoPreviewBox').innerHTML = `<img src="${capturedImage}" class="w-full h-full object-cover rounded-2xl">`;
                $('voiceNoteInput').value = rec.note || '';
                checkInputText();
                document.querySelectorAll('.stage-btn').forEach(b => { if ((rec.stages || []).includes(b.textContent)) b.classList.add('stage-selected'); });
                document.querySelectorAll('.action-btn').forEach(b => { if ((rec.actions || []).includes(b.textContent)) b.classList.add('action-selected'); });
                if (rec.leafColor) $('leafColor').value = rec.leafColor;
                if (rec.leafSize) $('leafSize').value = rec.leafSize;
                if (rec.soil) $('soilState').value = rec.soil;
                if (rec.bugState) $('bugState').value = rec.bugState;
            } else {
                $('modalTitle').innerText = "📝 오늘의 관찰 카드 쓰기";
                $('photoPreviewBox').innerHTML = `<span class="text-4xl mb-1">📷</span><span class="text-base font-bold">터치해서 사진 선택하기!</span>`;
            }
            $('recordModal').classList.remove('hidden');
        }

        function closeRecordModal() {
            if (isRecording) stopSpeechRecognition();
            $('recordModal').classList.add('hidden');
        }

        function openNewPlantModal() { $('newPlantModal').classList.remove('hidden'); }
        function closeNewPlantModal() { $('newPlantModal').classList.add('hidden'); }

        async function addNewPlant() {
            const name = $('newPlantName').value.trim();
            if (!name) return alert('식물 이름을 입력해 주세요!');
            if (getPlantList().includes(name)) return alert('이미 존재하는 식물이에요!');
            await savePlantList([...getPlantList(), name]);
            currentPlant = name;
            $('newPlantName').value = '';
            closeNewPlantModal();
            await renderDashboard();
        }

        function previewImage(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onerror = () => alert('사진을 불러오지 못했어요.');
            reader.onload = (e) => {
                const img = new Image();
                img.onerror = () => alert('사진을 불러오지 못했어요.');
                img.onload = () => {
                    const MAX = 800;
                    let width = img.width, height = img.height;
                    if (width > height) {
                        if (width > MAX) { height *= MAX / width; width = MAX; }
                    } else if (height > MAX) { width *= MAX / height; height = MAX; }
                    const canvas = document.createElement('canvas');
                    canvas.width = width;
                    canvas.height = height;
                    canvas.getContext('2d').drawImage(img, 0, 0, width, height);
                    capturedImage = canvas.toDataURL('image/jpeg', 0.7);
                    $('photoPreviewBox').innerHTML = `<img src="${capturedImage}" class="w-full h-full object-cover rounded-2xl">`;
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function checkInputText() {
            $('clearBtn').classList.toggle('hidden', $('voiceNoteInput').value.length === 0);
        }

        function clearVoiceInput() {
            const input = $('voiceNoteInput');
            input.value = '';
            checkInputText();
            input.focus();
        }

        // ---------- 음성 입력 ----------
        function toggleSpeechRecognition() {
            if (isRecording) stopSpeechRecognition(); else startSpeechRecognition();
        }

        function startSpeechRecognition() {
            const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SR) return alert('음성 인식을 지원하지 않는 브라우저입니다. 직접 작성해 주세요!');

            recognition = new SR();
            recognition.lang = 'ko-KR';
            recognition.continuous = false;
            recognition.interimResults = false;

            recognition.onstart = () => {
                isRecording = true;
                triggerHaptic();
                playSound(880, 0.15);
                const btn = $('speechBtn');
                btn.className = "bg-red-500 text-white w-14 h-14 rounded-xl text-2xl flex items-center justify-center mic-recording transition flex-shrink-0 shadow";
                btn.innerText = "🔴";
                $('voiceNoteInput').placeholder = "지금 말씀하세요! (터치시 종료)";
            };
            recognition.onresult = (event) => {
                $('voiceNoteInput').value = event.results[0][0].transcript;
                checkInputText();
            };
            recognition.onerror = (e) => {
                stopSpeechRecognition();
                if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
                    alert('마이크나 음성 인식을 쓸 수 없어요. 설정에서 허용하거나 키보드로 써 주세요!');
                }
            };
            recognition.onend = () => stopSpeechRecognition();

            try { recognition.start(); } catch (e) { stopSpeechRecognition(); }
        }

        function stopSpeechRecognition() {
            if (recognition) {
                try { recognition.stop(); } catch (e) {}
                recognition = null;
            }
            if (isRecording) {
                isRecording = false;
                triggerHaptic();
                playSound(440, 0.15);
                const btn = $('speechBtn');
                btn.className = "bg-blue-500 text-white w-14 h-14 rounded-xl text-2xl flex items-center justify-center hover:bg-blue-600 transition flex-shrink-0 shadow";
                btn.innerText = "🎤";
                $('voiceNoteInput').placeholder = "마이크를 누르고 말해요!";
            }
        }

        // ---------- 저장 ----------
        async function saveRecord() {
            if (isSaving) return;
            if (!capturedImage) return alert('식물 사진을 꼭 선택하거나 찍어주세요! 📷');

            isSaving = true;
            const btn = $('saveBtn');
            btn.disabled = true;
            btn.classList.add('opacity-60');
            try {
                const stages = Array.from(document.querySelectorAll('.stage-btn.stage-selected')).map(b => b.textContent);
                const actions = Array.from(document.querySelectorAll('.action-btn.action-selected')).map(b => b.textContent);
                const today = new Date().toLocaleDateString('ko-KR', { month: 'long', day: 'numeric' });

                const recordData = {
                    plantName: $('recordPlantSelect').value,
                    date: (editingRecordId && editingDate) ? editingDate : today,
                    photo: capturedImage,
                    stages: stages.length > 0 ? stages : ['🌱 무럭무럭 자라는 중'],
                    leafColor: $('leafColor').value,
                    leafSize: $('leafSize').value,
                    soil: $('soilState').value,
                    bugState: $('bugState').value,
                    note: $('voiceNoteInput').value,
                    actions: actions.length > 0 ? actions : ['보기만 했어요 👀']
                };
                if (editingRecordId) recordData.id = editingRecordId;

                await saveRecordToDB(recordData);
                currentPlant = recordData.plantName;
                closeRecordModal();
                await renderDashboard();
                if (window.confetti) confetti({ particleCount: 120, spread: 70, origin: { y: 0.6 } });
            } catch (err) {
                console.error(err);
                alert('저장하지 못했어요. 저장 공간이 부족할 수 있어요. 백업을 받아 두고 다시 해 보세요.');
            } finally {
                isSaving = false;
                btn.disabled = false;
                btn.classList.remove('opacity-60');
            }
        }

        // ---------- 백업 / 복원 ----------
        async function exportData() {
            try {
                const backupData = { plants: getPlantList(), records: await getAllRecords() };
                const blob = new Blob([JSON.stringify(backupData, null, 2)], { type: 'application/json' });
                const fileName = `plant_journal_backup_${new Date().toISOString().slice(0, 10)}.json`;

                if (navigator.canShare) {
                    const file = new File([blob], fileName, { type: 'application/json' });
                    if (navigator.canShare({ files: [file] })) {
                        await navigator.share({ title: '새로이 식물일기 백업', files: [file] });
                        return;
                    }
                }

                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = fileName;
                document.body.appendChild(a);
                a.click();
                a.remove();
                setTimeout(() => URL.revokeObjectURL(url), 1000);
            } catch (err) {
                if (err.name !== 'AbortError') alert('백업 파일 생성 중 오류가 발생했습니다.');
            }
        }

        function importData(event) {
            const file = event.target.files[0];
            event.target.value = '';
            if (!file) return;
            const reader = new FileReader();
            reader.onerror = () => alert('파일을 읽지 못했어요.');
            reader.onload = async (e) => {
                let data;
                try { data = JSON.parse(e.target.result); } catch (err) { return alert('올바른 백업 파일이 아니에요.'); }
                if (!data || !Array.isArray(data.plants) || !Array.isArray(data.records)) return alert('올바른 백업 파일 형식이 아닙니다.');

                const records = data.records.filter(r => r && r.plantName && typeof r.photo === 'string' && r.photo.startsWith('data:image/'));
                const plants = data.plants.filter(p => typeof p === 'string' && p.trim());
                if (!confirm(`지금 있는 기록이 모두 지워지고, 백업 파일의 기록 ${records.length}개로 바뀌어요. 계속할까요?`)) return;

                try {
                    const old = await getAllRecords();
                    const t = db.transaction(STORE_NAME, 'readwrite');
                    const store = t.objectStore(STORE_NAME);
                    old.forEach(r => store.delete(r.id));
                    records.forEach(r => {
                        const copy = { ...r, stages: Array.isArray(r.stages) ? r.stages : [], actions: Array.isArray(r.actions) ? r.actions : [] };
                        delete copy.id;
                        store.add(copy);
                    });
                    await done(t);
                    await savePlantList(plants.length ? plants : [DEFAULT_PLANT]);
                    await syncPlants();
                    currentPlant = getPlantList()[0];
                    await renderDashboard();
                    alert('데이터가 성공적으로 복원되었습니다! 🎉');
                } catch (err) {
                    console.error(err);
                    alert('복원하지 못했어요. 기존 기록은 그대로예요.');
                }
            };
            reader.readAsText(file);
        }

        // ---------- 이미지 확대 ----------
        function showImageZoom(src) {
            if (!src) return;
            $('zoomedImage').src = src;
            $('imageZoomModal').classList.remove('hidden');
        }

        function showImageZoomFromContainer(container) {
            const img = container.querySelector('img');
            if (img) showImageZoom(img.src);
        }

        function closeImageZoom() { $('imageZoomModal').classList.add('hidden'); }

        initApp();
    </script>
</body>
</html>
